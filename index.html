const VIEWS={today:vToday,food:vFood,move:vMove,glow:vGlow,cycle:vCycle,prog:vProg,rev:vRev,plan:vPlan};
function render(){$('#dl').textContent=fmt(cur);$('#nav').innerHTML=TABS.map(t=>'<button data-a="tab" data-v="'+t[0]+'"'+(t[0]===tab?' aria-current="true"':'')+'>'+t[1]+'</button>').join('');$('#main').innerHTML=VIEWS[tab](cur)}
function upd(){const s=$('#sum');if(s)s.innerHTML=sumHtml(cur);const t=$('#tt');if(t){t.innerHTML=totHtml(cur);$('#ev').textContent=evalDay(cur)}}
function setPath(o,p,v){const a=p.split('.');a.slice(0,-1).forEach(x=>o=o[x]||(o[x]={}));o[a[a.length-1]]=v}
const findF=n=>FOODS.find(f=>f[0]===n);
let tint=0,tend=0;
function timer(min){clearInterval(tint);const el=()=>$('#tmr');if(!min){if(el())el().textContent='–:––';return}tend=Date.now()+min*60000;
 const tick=()=>{const s=Math.max(0,Math.round((tend-Date.now())/1000));if(el())el().textContent=Math.floor(s/60)+':'+pad(s%60);if(s<=0){clearInterval(tint);if(el())el().textContent='Done. Breathe out.'}};tick();tint=setInterval(tick,1000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,d=()=>dayOf(cur),was=armed;armed='';
 if(a==='tab'){tab=v;scrollTo(0,0)}
 else if(a==='day')cur=v==='0'?todayK:add(cur,+v);
 else if(a==='go')cur=v;
 else if(a==='wkn')cur=add(cur,7*v);
 else if(a==='hab'){const x=d(),n=((x.h[v]||0)+1)%3;if(n)x.h[v]=n;else delete x.h[v];touchDay(cur)}
 else if(a==='sug'){const f=findF(b.dataset.f);if(!f)return;d().m.push({s:v,f:f[0],q:f[1],c:f[2],p:f[3]});touchDay(cur)}
 else if(a==='delm'){d().m.splice(+v,1);touchDay(cur)}
 else if(a==='addm'){const g=i=>$('#a_'+i).value,f=g('f').trim();if(!f)return;d().m.push({s:g('s'),f,q:g('q'),c:g('c'),p:g('p'),cb:g('cb'),ft:g('ft')});touchDay(cur)}
 else if(a==='fv'){const x=d();x.fv=Math.max(0,(x.fv||0)+(+v));touchDay(cur)}
 else if(a==='w'){const x=d();x.w=(x.w||0)===+v?+v-1:+v;touchDay(cur)}
 else if(a==='timer'){timer(+v);return}
 else if(a==='ps'){if(!S.meta.cycle.some(c=>c.s===cur))S.meta.cycle.push({s:cur,e:''});touchMeta()}
 else if(a==='pe'){const l=S.meta.cycle.filter(c=>c.s&&c.s<=cur).sort((x,y)=>x.s<y.s?-1:1).pop();if(l){l.e=cur;touchMeta()}}
 else if(a==='delc'){S.meta.cycle=S.meta.cycle.filter(c=>c.s!==v);touchMeta()}
 else if(a==='adda'){const dt=$('#ap_d').value,n=$('#ap_n').value.trim();if(!dt||!n)return;S.meta.appts.push({d:dt,n});S.meta.appts.sort((x,y)=>x.d<y.d?-1:1);touchMeta()}
 else if(a==='dela'){S.meta.appts.splice(+v,1);touchMeta()}
 else if(a==='addb'){const g=i=>$('#b_'+i).value,e2={d:g('d')||cur};['w','waist','hips','thigh','plank','cl','cf','gl'].forEach(f=>e2[f]=g(f));if(!['w','waist','hips','thigh','plank','gl'].some(f=>e2[f]!==''))return;S.meta.body=S.meta.body.filter(x=>x.d!==e2.d);S.meta.body.push(e2);touchMeta()}
 else if(a==='delb'){S.meta.body=S.meta.body.filter(x=>x.d!==v);touchMeta()}
 else if(a==='csv'){const t=mkCsv();dl('reset27-days.csv',t,'text/csv');$('#io').value=t;return}
 else if(a==='bak'){const t=JSON.stringify(S);dl('reset27-backup.json',t,'application/json');$('#io').value=t;return}
 else if(a==='deld'||a==='delold'||a==='delall'){if(was!==a){armed=a;render();return}
  if(a==='deld')delete S.days[cur];
  else if(a==='delold'){const cut=add(todayK,-90);Object.keys(S.days).forEach(k=>{if(k<cut)delete S.days[k]});Object.keys(S.meta.wk).forEach(k=>{if(k<cut)delete S.meta.wk[k]})}
  else{S={meta:{body:[],cycle:[],rev:{},appts:[],cfg:defCfg(),_t:0},days:{}};fixMeta()}
  persist()}
 else if(a==='exp'){$('#io').value=JSON.stringify(S);return}
 else if(a==='imp'){try{const x=JSON.parse($('#io').value);if(!x||!x.meta||!x.days)throw 0;S=x;fixMeta();dirty.add('meta');Object.keys(S.days).forEach(k=>dirty.add(mk(k)));persist()}catch(er){setSync('That text is not a valid backup.');return}}
 else return;
 render()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='a_f'){const f=findF(t.value);if(f){$('#a_q').value=f[1];$('#a_c').value=f[2];$('#a_p').value=f[3]}return}
 if(t.dataset.pg!==undefined){pgEx=t.value;render();return}
 const val=t.type==='checkbox'?(t.checked?1:0):t.type==='number'?(t.value===''?'':+t.value):t.value,rr=t.type==='checkbox'||t.tagName==='SELECT',D=t.dataset;
 if(D.d){setPath(dayOf(cur),D.d,val);touchDay(cur)}
 else if(D.m){const[i,f]=D.m.split('.'),x=dayOf(cur).m[i];if(!x)return;x[f]=val;touchDay(cur)}
 else if(D.x){const[n,f]=D.x.split('|'),x=dayOf(cur);(x.ex[n]=x.ex[n]||{})[f]=val;touchDay(cur)}
 else if(D.w){wkOf(cur)[D.w]=val;touchMeta()}
 else if(D.c){S.meta.cfg[D.c]=D.c==='start'?t.value:num(t.value);touchMeta()}
 else if(D.rv){const[key,f]=D.rv.split('|');(S.meta.rev[key]=S.meta.rev[key]||{})[f]=val;touchMeta()}
 else return;
 if(rr)render();else upd()});
render();setSync('Saved on this phone only');try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
</body></html>
