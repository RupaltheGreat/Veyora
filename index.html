function predictCycle(){

 gaps.forEach(g=>g.ok=g.n>=18&&g.n<=60);
 const ok=gaps.filter(g=>g.ok).slice(-6),last=st[st.length-1]||null;
 const pl=cy.filter(c=>c.e).map(c=>diffD(c.s,c.e)+1).filter(n=>n>=1&&n<=15).slice(-6);
 const P={n:st.length,gaps,last,plen:pl.length?Math.round(avg(pl)):5,plenLogged:pl.length>0,mode:'none',used:[],mean:null,sd:null,lo:null,hi:null,mid:null,conf:'',late:0};
 if(!last)return P;
 let mean,half,used=ok;
 if(ok.length<3){P.mode='default';mean=29;half=1;used=[]}
 else{const med=median(ok.map(g=>g.n));used=ok.filter(g=>Math.abs(g.n-med)<=10);if(used.length<3)used=ok;
  const w=used.map((g,i)=>i+1);mean=sum(used.map((g,i)=>g.n*w[i]))/sum(w);
  const m2=avg(used.map(g=>g.n));P.sd=Math.sqrt(avg(used.map(g=>(g.n-m2)*(g.n-m2))));
  half=Math.min(8,Math.max(2,Math.round(P.sd)));P.mode='personal'}
 P.mean=mean;P.used=used;P.half=half;
 P.mid=add(last,Math.round(mean));P.lo=add(last,Math.round(mean)-half);P.hi=add(last,Math.round(mean)+half);
 P.conf=P.mode==='default'?'Low: standard estimate':P.sd<=2&&used.length>=4?'Good':P.sd<=4?'Fair':'Low: your cycles vary a lot';
 if(todayK>P.hi)P.late=diffD(P.hi,todayK);
 return P}

 '<div class="legend"><span><i class="sw gr"></i>Mostly done</span><span><i class="sw y"></i>Partly</span><span><i class="sw r"></i>Missed or very low</span><span><i class="sw n"></i>Not tracked</span><span><i class="sw pb"></i>Period</span><span><i class="dot a"></i>Appointment</span><span><i class="dot n"></i>Note</span></div><p class="note">Grey means you did not track that day. It is never counted as missed.</p></div>';
 h+=dayPanel(selCal);
 const rows=[];for(let i=7;i>=0;i--){const w=add(wkS(todayK),-7*i);let tr=0,dn=0,pa=0,sk=0;const ps=[];for(let j=0;j<7;j++){const k=add(w,j);if(k>todayK)break;const s=score(k);if(s.tr){tr++;dn+=s.dn;pa+=s.pa;sk+=s.sk;ps.push(s.pct)}}rows.push([w,tr,dn,pa,sk,ps.length?Math.round(avg(ps)):null])}
 h+='<div class="card"><h3>Past weeks</h3><div class="tw"><table><tr><th>Week of</th><th>Days tracked</th><th>Done</th><th>Partly</th><th>Skipped</th><th>Average</th></tr>'+rows.reverse().map(r=>'<tr><td>'+sh(r[0])+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+(r[5]==null?'–':r[5]+'%')+'</td></tr>').join('')+'</table></div></div>';
 return h}
/* ---------- Plan ---------- */
function vPlan(){const c=S.meta.cfg;
 const tt=[['5:50','Wake up, water, wash face'],['6:00','Workout 30–40 min, or yoga and mobility'],['6:40','Cool down, breathing, posture'],['7:00','Bath, skincare, sunscreen'],['7:30','Breakfast'],['8:00','Get ready and commute. Carry lunch, snack, water'],['9:00–19:00','Office. Snack 11:00, lunch 13:30, stand up every 30–60 min'],['17:00','Evening snack (or have one outside after office)'],['20:00','Dinner'],['20:30','Editing, acting, reading or learning'],['21:30','Night skincare, prep clothes and meals'],['22:00','Sleep, 7–9 hours']];
 let h='<div class="card"><h2>My plan</h2><p class="note">Reference only. Nothing here needs filling in. If you cannot wake at 5:50, move the whole routine later. Sleep matters more than an early workout.</p>'+
 det('p1','Weekday timetable (office 9 AM–7 PM)','<div class="tw"><table>'+tt.map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td></tr>').join('')+'</table></div>')+
 det('p2','Weekend plan','<p><b>Saturday:</b> 7–8 skating or badminton (alternate weeks), 11–12 zumba or dance, 2–3 acting and expressions, 8–9 one small editing task. Haircare day.<br><b>Sunday:</b> gentle yoga and a walk, afternoon meal prep, groceries and laundry, evening reading, journaling and planning. Haircare day.</p><p class="note">Do not force every activity into every weekend.</p>')+
 det('p3','Weekly workout split','<div class="tw"><table>'+EX.map((e,i)=>'<tr><td><b>'+DN[i]+'</b></td><td>'+e[0]+(e[1].length?'<br><small class="note">'+e[1].map(x=>x[0]).join(', ')+'</small>':'')+'</td></tr>').join('')+'</table></div><p class="note">Week 1 lighter sets, week 2 full sets, week 3 add reps or weight, week 4 hold and perfect form. Leave 1–3 reps in reserve.</p>')+
 det('p4','Food rotation and guidance',rotTable()+'<p class="note">Meals come from home and the office, so this is a guide, not a rule. Vegetarian days use paneer, soy, milk, curd, dal and chickpeas for protein. For protein estimates you can give your meal list to a nutrition tool or a dietitian.</p><p class="note">Mass gainer (optional): read serving size and calories on your own tub, start with about a quarter serving after training, and stop if it makes you too full for meals. Ask a doctor first if you have kidney or blood-sugar conditions.</p>')+
 det('p5','Skincare and haircare','<ul><li>Morning: gentle cleanser, moisturiser, sunscreen SPF 30–50, lip balm</li><li>Night: cleanse, moisturiser, lip balm</li><li>Masks: Wednesday aloe vera gel, Sunday plain yogurt, patch-test first</li><li>Haircare: Saturday and Sunday. Wash 2–3 times a week at most, condition, detangle gently</li></ul><p class="note">Masks and oils condition. They do not grow hair. Persistent hair fall deserves a doctor visit.</p>')+
 det('p6','Posture and ergonomics','<ul>'+POST.map(p=>'<li>'+p+'</li>').join('')+'</ul><p class="note">Screen at eye level, feet supported, stand up every 30–60 min. Neutral and relaxed beats forced.</p>')+
 det('p7','Personal development','<p>Weekdays: 20–30 minutes of editing, acting practice, reading or learning. Saturday: acting, expressions and one small edit. Sunday: reading, journaling, planning. Finish old videos one small step at a time.</p>')+
 det('p8','Grocery list and Sunday prep','<p>Eggs, chicken, fish, paneer, milk, curd, Greek yogurt, soy chunks, dal, rajma, chana, rice, atta, oats, poha, bread, peanut butter, bananas, seasonal fruit, guava, amla, dates, nuts, seeds, spinach, vegetables, aloe vera gel, coconut oil.</p><ul><li>Soak rajma or chana, boil eggs</li><li>Cook dal and a base gravy, chop vegetables</li><li>Portion nuts and dates, plan the week’s lunches</li></ul>')+
 det('p9','Realistic expectations','<p>Exercise builds muscle and strength over months. It cannot remove fat from one spot, choose where weight is gained, change facial bones or teeth, or change breast size. Your BMI is around 18.3, so the aim is gradual muscle gain, not weight loss. Irregular periods and hair fall deserve a medical check-up.</p>')+'</div>';
 h+='<div class="card"><h3>Settings</h3><div class="g">'+fld('Your name (optional)','data-c="name"',c.name)+fld('Programme start date','data-c="start"',c.start,'date')+'</div></div>';
 h+='<div class="card"><h3>Your data on this phone</h3><p class="note">Everything stays inside this app on your phone. Nothing is sent anywhere. Download a spreadsheet or backup, or delete what you no longer want. Deleting cannot be undone.</p><div class="row"><button class="btn" data-a="csv">Download spreadsheet (CSV)</button><button class="btn" data-a="bak">Download backup file</button></div><div class="row" style="margin-top:10px">'+
 [['deld','Delete this day’s entries','Tap again to delete this day'],['delold','Delete entries older than 90 days','Tap again to confirm'],['delall','Delete everything','Tap again to delete ALL data']].map(x=>'<button class="btn b" data-a="'+x[0]+'">'+(armed===x[0]?x[2]:x[1])+'</button>').join('')+
 '</div><h3 style="margin-top:14px">Restore</h3><p class="note">Paste a backup (from this or the older version of the app) and press Restore. Old entries are converted safely.</p><textarea id="io" style="min-height:80px"></textarea><div class="row" style="margin-top:8px"><button class="btn b" data-a="imp">Restore from text</button></div></div>';
 return h}

/* ---------- app shell ---------- */
const TABS=[['today','Today'],['food','Food'],['move','Move'],['glow','Glow'],['cycle','Cycle'],['care','Care'],['prog','Progress'],['plan','Plan'],['cal','Calendar']];
const VIEWS={today:vToday,food:vFood,move:vMove,glow:vGlow,cycle:vCycle,care:vCare,prog:vProg,plan:vPlan,cal:vCal};
function render(){
 document.querySelectorAll('details[data-oid]').forEach(x=>{x.open?openSet.add(x.dataset.oid):openSet.delete(x.dataset.oid)});
 $('#dl').textContent=fmt(cur);$('.dn').hidden=!['today','food','move','glow'].includes(tab);
 $('#nav').innerHTML=TABS.map(t=>'<button data-a="tab" data-v="'+t[0]+'"'+(t[0]===tab?' aria-current="true"':'')+'>'+t[1]+'</button>').join('');
 $('#main').innerHTML=VIEWS[tab](cur);
 document.querySelectorAll('details[data-oid]').forEach(x=>{x.open=openSet.has(x.dataset.oid)});
 try{const a=$('#nav [aria-current]');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
let tint=0,tend=0;
function timer(min){clearInterval(tint);const el=()=>$('#tmr');if(!min){if(el())el().textContent='–:––';return}tend=Date.now()+min*60000;
 const tick=()=>{const s=Math.max(0,Math.round((tend-Date.now())/1000));if(el())el().textContent=Math.floor(s/60)+':'+pad(s%60);if(s<=0){clearInterval(tint);if(el())el().textContent='Done. Breathe out.'}};tick();tint=setInterval(tick,1000)}
function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function mkCsv(){const H=['date','overall_pct','done','partly','skipped','breakfast','mid_morning','lunch','evening_snack','dinner','haircare','note'];
 const rows=Object.keys(S.days).sort().map(k=>{const d=peek(k),s=score(k);return [k,s.tr?s.pct:'',s.dn,s.pa,s.sk,d.meal.bf,d.meal.ms,d.meal.ln,d.meal.es,d.meal.dn,d.hc&&d.hc.on===1?'yes':d.hc&&d.hc.on===0?'no':'',d.note]});
 return [H].concat(rows).map(r=>r.map(csvEsc).join(',')).join('\n')}
function dl(name,text,type){try{const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){}}
const byId=(arr,id)=>arr.findIndex(x=>x.id===id);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,was=armed;armed='';const D=()=>dayOf(cur);
 switch(a){
 case 'tab':tab=v;scrollTo(0,0);break;
 case 'day':cur=v==='0'?todayK:add(cur,+v);break;
 case 'tg':openSet.has(v)?openSet.delete(v):openSet.add(v);break;
 case 'st':{const ids=b.dataset.ids.split('|'),n=+v,nv=aggS(cur,ids)===n?0:n,d=D();ids.forEach(i=>{if(nv)d.st[i]=nv;else delete d.st[i]});save();break}
 case 'allx':{const ids=b.dataset.ids.split('|'),d=D(),all=ids.every(i=>d.st[i]===1);ids.forEach(i=>{if(all)delete d.st[i];else d.st[i]=1});save();break}
 case 'hy':{const d=D();if(d.hc&&d.hc.on===1&&b.closest('.seg'))delete d.hc;else d.hc={on:1,did:(d.hc&&d.hc.did)||{},extra:!HAIRREG.includes(dow(cur))};save();break}
 case 'hn':{const d=D();if(d.hc&&d.hc.on===0)delete d.hc;else d.hc={on:0};save();break}
 case 'hx':delete D().hc;save();break;
 case 'hd':{const d=D();if(d.hc){d.hc.did=d.hc.did||{};d.hc.did[v]=!d.hc.did[v]}save();break}
 case 'fsk':{const d=D();if(d.fs[v]===2)delete d.fs[v];else d.fs[v]=2;save();break}
 case 'w':{const d=D();d.w=(d.w||0)===+v?+v-1:+v;save();break}
 case 'act':{const n=v||$('#ac_t').value.trim();if(!n){toast('Type an activity first.');return}const d=D(),id=uid();d.ct.push({id,t:n,c:'move'});d.st['c:'+id]=1;save();break}
 case 'addt':{const t=$('#nt_t').value.trim();if(!t){toast('Type a task first.');return}
  const c=$('#nt_c').value||'pers',r=$('#nt_r').value,id=uid();
  if(r==='0')D().ct.push({id,t,c});else S.meta.rt.push({id,t,c,days:r==='d'?[0,1,2,3,4,5,6]:r==='w'?[0,1,2,3,4]:[5,6],from:cur});
  save();toast('Task added');break}
 case 'edit':editId=v;break;
 case 'edsave':{const el=[...document.querySelectorAll('[data-ed]')].find(x=>x.dataset.ed===v),n=el?el.value.trim():'',id=v.slice(2);
  if(n){const i=byId(S.meta.rt,id);if(i>=0)S.meta.rt[i].t=n;else{const j=byId(D().ct,id);if(j>=0)D().ct[j].t=n}save()}editId='';break}
 case 'rmc':{const id=v.slice(2),i=byId(S.meta.rt,id);
  if(i>=0){if(was!=='rm'+v){armed='rm'+v;break}S.meta.rt.splice(i,1)}
  else{const d=D(),j=byId(d.ct,id);if(j>=0)d.ct.splice(j,1);delete d.st[v]}
  save();break}
 case 'cym':cyM=addM(cyM,+v);break;
 case 'cysel':selCy=v;cyM=v.slice(0,7);break;
 case 'ps':{if(selCy>todayK){toast('You can only log dates up to today.');return}
  if(S.meta.cycle.some(c=>selCy>=c.s&&(c.e?selCy<=c.e:selCy===c.s))){toast('That date is already inside a logged period.');return}
  S.meta.cycle.push({id:uid(),s:selCy,e:''});S.meta.cycle.sort((x,y)=>x.s<y.s?-1:1);save();toast('Period start saved. Now select the end date when it finishes.');break}
 case 'pe':{const c=S.meta.cycle.filter(x=>x.s<=selCy).pop();
  if(!c){toast('Mark a period start on or before this date first.');return}
  if(selCy>todayK){toast('You can only log dates up to today.');return}
  if(diffD(c.s,selCy)>14){toast('That is more than 15 days after the start. Please check the dates.');return}
  c.e=selCy;save();toast('Period end saved');break}
 case 'delcy':{if(was!=='dc'+v){armed='dc'+v;break}const i=byId(S.meta.cycle,v);if(i>=0)S.meta.cycle.splice(i,1);save();break}
 case 'addm':{const m={id:uid(),n:'New appointment',cl:'',pl:'',tk:'',st:'To book',nt:'',fu:''};S.meta.med.push(m);openSet.add('m:'+m.id);save();break}
 case 'delm':{if(was!=='dm'+v){armed='dm'+v;break}const i=byId(S.meta.med,v);if(i>=0)S.meta.med.splice(i,1);save();break}
 case 'pgr':pgR=+v;break;
 case 'addb':{const g=i=>$('#b_'+i).value,e2={d:g('d')||cur,w:g('w'),waist:g('waist'),hips:g('hips'),thigh:g('thigh')};
  if(!['w','waist','hips','thigh'].some(f=>e2[f]!=='')){toast('Enter at least one measurement.');return}
  S.meta.body=S.meta.body.filter(x=>x.d!==e2.d);S.meta.body.push(e2);save();break}
 case 'delb':S.meta.body=S.meta.body.filter(x=>x.d!==v);save();break;
 case 'cmn':calM=addM(calM,+v);break;
 case 'calsel':selCal=v;calM=v.slice(0,7);break;
 case 'calopen':cur=v;tab='today';scrollTo(0,0);break;
 case 'addev':{const t=$('#ev_t').value.trim();if(!t){toast('Type a note first.');return}(S.meta.ev[selCal]=S.meta.ev[selCal]||[]).push(t);save();break}
 case 'delev':{const l=S.meta.ev[selCal]||[];l.splice(+v,1);if(!l.length)delete S.meta.ev[selCal];save();break}
 case 'timer':timer(+v);return;
 case 'csv':{const t=mkCsv();dl('reset27-days.csv',t,'text/csv');$('#io').value=t;return}
 case 'bak':{const t=JSON.stringify(S);dl('reset27-backup.json',t,'application/json');$('#io').value=t;return}
 case 'deld':case 'delold':case 'delall':{if(was!==a){armed=a;break}
  if(a==='deld')delete S.days[cur];
  else if(a==='delold'){const cut=add(todayK,-90);Object.keys(S.days).forEach(k=>{if(k<cut)delete S.days[k]})}
  else{S={meta:defMeta(),days:{}};migrateAll()}
  save();toast('Deleted');break}
 case 'imp':{try{const x=JSON.parse($('#io').value);if(!x||!x.meta||!x.days)throw 0;S=x;migrateAll();save();toast('Restored')}catch(er){toast('That text is not a valid backup.');return}break}
 default:return}
 render()});
document.addEventListener('change',e=>{const t=e.target,D=t.dataset;
 const val=t.type==='number'?(t.value===''?'':+t.value):t.value,rr=t.tagName==='SELECT'||t.type==='date';
 if(D.d){setPath(dayOf(D.k||cur),D.d,val);save();if(rr)render();return}
 if(D.cy){const c=S.meta.cycle.find(x=>x.id===D.cy);if(!c)return;const v=t.value;
  if(D.f==='s'){if(!v||v>todayK||(c.e&&v>c.e)){toast('Please check the start date.');render();return}c.s=v}
  else{if(v&&(v<c.s||v>todayK||diffD(c.s,v)>14)){toast('End must be on or after the start, within 15 days.');render();return}c.e=v}
  S.meta.cycle.sort((x,y)=>x.s<y.s?-1:1);save();render();return}
 if(D.md){const m=S.meta.med.find(x=>x.id===D.md);if(!m)return;m[D.f]=t.value;save();if(rr)render();return}
 if(D.dt!==undefined){const m=S.meta.dent.teeth[+D.dt];if(!m)return;m[D.f]=t.value;save();if(rr)render();return}
 if(D.br){S.meta.dent.br[D.f]=t.value;save();if(rr)render();return}
 if(D.c){S.meta.cfg[D.c]=t.value;save();if(D.c==='start')render();return}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id,m={nt_t:'addt',ev_t:'addev',ac_t:'act'};
 if(m[id]){e.preventDefault();const b=document.querySelector('[data-a="'+m[id]+'"]');if(b)b.click()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&dk(new Date())!==todayK)location.reload()});
render();setSync('Saved on this phone only');
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
